name: CI

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  policy:
    name: Policy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: node --test scripts/*.test.mjs
      - run: node scripts/check-workflows.mjs
      - run: node scripts/contrast.mjs
      - run: node scripts/check-deps.mjs --audit tracer web deploy

  secrets:
    name: Gitleaks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: >-
          docker run --rm -v "$PWD:/repo:ro"
          zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --no-banner --redact

  tracer:
    name: Tracer (CPython 3.14)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - run: pip install --no-deps -r tracer/requirements.txt
      - run: python -m pytest tracer -v

  web:
    name: Web
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: The tracer's tests and every library example, inside the pinned Pyodide
        run: npm run smoke
      - run: npx playwright install --with-deps chromium
      - name: Icons and the Open Graph image, rendered from HTML
        run: node scripts/assets.mjs
      - run: npm run build
      - name: End-to-end tests with axe, desktop and phone, under the production headers
        run: npx playwright test
      - name: Review screenshots, desktop and phone, light and dark
        if: success()
        run: node scripts/shots.mjs
      - name: Keep the screenshots
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: .review
          retention-days: 14
      - name: Keep the report when e2e fails
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7
      - name: Hand the tested build to the deploy job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: web/dist
          retention-days: 3

  deploy:
    name: Deploy to Cloudflare Pages
    if: github.ref == 'refs/heads/main'
    needs: [policy, secrets, tracer, web]
    runs-on: ubuntu-24.04
    concurrency:
      group: deploy-pages
      cancel-in-progress: false
    env:
      # A token scoped to Cloudflare Pages: Edit on one account, nothing else.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    outputs:
      deployed: ${{ steps.ready.outputs.ok }}
    steps:
      - name: Skip until the Cloudflare secrets exist
        id: ready
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID not set; skipping the deploy."
          fi
      - if: steps.ready.outputs.ok == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: steps.ready.outputs.ok == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: deploy/package-lock.json
      - if: steps.ready.outputs.ok == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: web/dist
      - name: Install the pinned wrangler
        if: steps.ready.outputs.ok == 'true'
        working-directory: deploy
        run: npm ci
      - name: Create the Pages project on the first deploy
        if: steps.ready.outputs.ok == 'true'
        working-directory: deploy
        run: |
          npx wrangler pages project list > projects.txt
          if ! grep -qw dryrun projects.txt; then
            npx wrangler pages project create dryrun --production-branch main
          fi
      - name: Deploy web/dist
        if: steps.ready.outputs.ok == 'true'
        working-directory: deploy
        # A project created seconds earlier can read as missing for a moment: retry.
        run: |
          for attempt in 1 2 3; do
            if npx wrangler pages deploy ../web/dist --project-name dryrun --branch main --commit-hash "$GITHUB_SHA"; then
              exit 0
            fi
            echo "::warning::deploy attempt $attempt failed; retrying in 20 s"
            sleep 20
          done
          exit 1

  live:
    name: Live site checks
    needs: deploy
    if: github.ref == 'refs/heads/main' && needs.deploy.outputs.deployed == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            deploy/package-lock.json
      - name: No injected third-party script (Cloudflare Web Analytics is off for the zone)
        run: |
          set -o pipefail
          for path in / /app; do
            html=$(curl -fsSL "https://dryrun.dhruvgoyal.tech$path")
            if echo "$html" | grep -Eqi 'cloudflareinsights|beacon\.min\.js|static\.cloudflareinsights'; then
              echo "::error::$path carries an injected analytics script"
              exit 1
            fi
            curl -fsSI "https://dryrun.dhruvgoyal.tech$path" | grep -i '^content-security-policy:'
          done
      - name: End-to-end on the live site
        working-directory: web
        env:
          E2E_BASE_URL: https://dryrun.dhruvgoyal.tech
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test --grep "landing|load, run, scrub|works offline|share link"
      - name: Install the pinned Lighthouse
        working-directory: deploy
        run: npm ci
      - name: Lighthouse on the live site (median of three runs per preset; see the job summary)
        working-directory: deploy
        run: node lighthouse.mjs https://dryrun.dhruvgoyal.tech/
